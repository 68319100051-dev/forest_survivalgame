name: CI/CD - Build & Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for npm install)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies (optional, just to ensure lock file exists)
        run: npm ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/forest_survivalgame:latest .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/forest_survivalgame:latest

      - name: Output image reference (for Render)
        run: echo "Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/forest_survivalgame:latest"
